rả dữ liệu giá và tồn kho</tspan></text><rect class="frame" x="55" y="445" width="1510" height="650"/><rect class="box" x="55" y="445" width="65" height="30"/><text x="87" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="87" dy="0">alt</tspan></text><text x="140" y="470" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="140" dy="0">[JWT hoặc dữ liệu không hợp lệ]</tspan></text><line class="ret" x1="820" y1="520" x2="480" y2="520"/><text x="650" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="650" dy="0">6a. 400/401/403 - từ chối tạo đơn</tspan></text><line class="ret" x1="480" y1="570" x2="130" y2="570"/><text x="305" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="305" dy="0">7a. Hiển thị lỗi và yêu cầu chỉnh sửa</tspan></text><line x1="55" y1="620" x2="1565" y2="620" stroke="#334155" stroke-dasharray="8 5"/><text x="140" y="645" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="140" dy="0">[Dữ liệu hợp lệ]</tspan></text><line class="msg" x1="820" y1="690" x2="1160" y2="690"/><text x="990" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="990" dy="0">6b. BEGIN; khóa Product và kiểm tra tổng tồn</tspan></text><line class="ret" x1="1160" y1="745" x2="820" y2="745"/><text x="990" y="735" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="990" dy="0">7b. Kết quả kiểm tra tồn</tspan></text><rect class="frame" x="610" y="775" width="770" height="270"/><rect class="box" x="610" y="775" width="65" height="30"/><text x="642" y="796" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="642" dy="0">alt</tspan></text><text x="690" y="800" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="690" dy="0">[Thiếu tồn hoặc lỗi DB]</tspan></text><line class="msg" x1="820" y1="840" x2="1160" y2="840"/><text x="990" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="990" dy="0">8a. ROLLBACK</tspan></text><line class="ret" x1="820" y1="890" x2="480" y2="890"/><text x="650" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="650" dy="0">9a. 409/500 - không tạo đơn</tspan></text><line x1="610" y1="930" x2="1380" y2="930" stroke="#334155" stroke-dasharray="8 5"/><text x="690" y="955" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="690" dy="0">[Đủ tồn]</tspan></text><line class="msg" x1="820" y1="990" x2="1160" y2="990"/><text x="990" y="971.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="990" dy="0">8b. Trừ tồn; tạo Order + OrderItem snapshot;</tspan><tspan x="990" dy="16.52">COMMIT</tspan></text><line class="ret" x1="1160" y1="1040" x2="820" y2="1040"/><text x="990" y="1030" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="990" dy="0">9b. Order Chờ thanh toán</tspan></text><line class="ret" x1="820" y1="1135" x2="480" y2="1135"/><text x="650" y="1116.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="650" dy="0">10. 201 Created (mã đơn, tổng tiền, trạng</tspan><tspan x="650" dy="16.52">thái)</tspan></text><line class="ret" x1="480" y1="1180" x2="130" y2="1180"/><text x="305" y="1170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="305" dy=