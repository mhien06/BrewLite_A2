<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2070" viewBox="0 0 1800 2070"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><style>.lane{fill:#f8fafc;stroke:#64748b;stroke-width:1.4}.box{fill:white;stroke:#1f2937;stroke-width:1.7}.decision{fill:#fff;stroke:#1f2937;stroke-width:1.7}.flow{fill:none;stroke:#1f2937;stroke-width:1.8;marker-end:url(#arrow)}.life{stroke:#64748b;stroke-width:1.4;stroke-dasharray:7 6}.msg{stroke:#1f2937;stroke-width:1.5;marker-end:url(#arrow)}.ret{stroke:#475569;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}.frame{fill:none;stroke:#334155;stroke-width:1.5}.guard{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#111827}</style></defs><text x="900" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#111827"><tspan x="900" dy="0">TASK 2.2B - SEQUENCE DIAGRAM: THANH TOÁN VNPAY SANDBOX</tspan></text><circle cx="130" cy="91" r="11" fill="white" stroke="#1f2937" stroke-width="2"/><path d="M 130 102 L 130 126 M 112 111 L 148 111 M 130 126 L 114 146 M 130 126 L 146 146" fill="none" stroke="#1f2937" stroke-width="2"/><text x="130" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827"><tspan x="130" dy="0">Customer</tspan></text><line class="life" x1="130" y1="178" x2="130" y2="2020"/><rect class="box" x="380" y="80" width="240" height="58"/><text x="500" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827"><tspan x="500" dy="0">Next.js UI</tspan></text><line class="life" x1="500" y1="138" x2="500" y2="2020"/><rect class="box" x="740" y="80" width="240" height="58"/><text x="860" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827"><tspan x="860" dy="0">NestJS API</tspan></text><line class="life" x1="860" y1="138" x2="860" y2="2020"/><rect class="box" x="1100" y="80" width="240" height="58"/><text x="1220" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827"><tspan x="1220" dy="0">Database</tspan></text><line class="life" x1="1220" y1="138" x2="1220" y2="2020"/><rect class="box" x="1520" y="80" width="240" height="58"/><text x="1640" y="105.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827"><tspan x="1640" dy="0">VNPay Sandbox «Payment</tspan><tspan x="1640" dy="17.7">Service»</tspan></text><line class="life" x1="1640" y1="138" x2="1640" y2="2020"/><line class="msg" x1="130" y1="185" x2="500" y2="185"/><text x="315" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="315" dy="0">1. Chọn Thanh toán đơn</tspan></text><line class="msg" x1="500" y1="235" x2="860" y2="235"/><text x="680" y="216.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="680" dy="0">2. POST /payments (JWT, orderId, idempotency</tspan><tspan x="680" dy="16.52">key)</tspan></text><line class="msg" x1="860" y1="285" x2="860" y2="285"/><text x="860" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="860" dy="0">3. Kiểm tra JWT, quyền sở hữu và dữ liệu</tspan></text><line class="msg" x1="860" y1="335" x2="1220" y2="335"/><text x="1040" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1040" dy="0">4. Tra Order, Payment đang mở và idempotency key</tspan></text><line class="ret" x1="1220" y1="385" x2="860" y2="385"/><text x="1040" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1040" dy="0">5. Trả dữ liệu đối chiếu</tspan></text><rect class="frame" x="55" y="420" width="1585" height="455"/><rect class="box" x="55" y="420" width="65" height="30"/><text x="87" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="87" dy="0">alt</tspan></text><text x="140" y="445" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="140" dy="0">[Cùng key + cùng payload]</tspan></text><line class="ret" x1="860" y1="500" x2="500" y2="500"/><text x="680" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="680" dy="0">6a. Trả URL/kết quả đã lưu; không tạo mới</tspan></text><line x1="55" y1="540" x2="1640" y2="540" stroke="#334155" stroke-dasharray="8 5"/><text x="140" y="565" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="140" dy="0">[Cùng key + khác payload]</tspan></text><line class="ret" x1="860" y1="615" x2="500" y2="615"/><text x="680" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="680" dy="0">6b. 409 Conflict</tspan></text><line x1="55" y1="655" x2="1640" y2="655" stroke="#334155" stroke-dasharray="8 5"/><text x="140" y="671.88" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="140" dy="0">[Key mới nhưng Order không đủ</tspan><tspan x="140" dy="16.52">điều kiện]</tspan></text><line class="ret" x1="860" y1="730" x2="500" y2="730"/><text x="680" y="711.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="680" dy="0">6c. 409 - đã thanh toán/sai trạng thái/đang xác</tspan><tspan x="680" dy="16.52">minh</tspan></text><line x1="55" y1="770" x2="1640" y2="770" stroke="#334155" stroke-dasharray="8 5"/><text x="140" y="795" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="140" dy="0">[Key mới và Order đủ điều kiện]</tspan></text><line class="msg" x1="860" y1="825" x2="1220" y2="825"/><text x="1040" y="806.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1040" dy="0">6d. Tạo Payment PENDING, mã tham chiếu, hạn 15</tspan><tspan x="1040" dy="16.52">phút</tspan></text><line class="ret" x1="1220" y1="860" x2="860" y2="860"/><text x="1040" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1040" dy="0">7. Đã lưu Payment</tspan></text><line class="ret" x1="860" y1="920" x2="500" y2="920"/><text x="680" y="910" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="680" dy="0">8. Trả URL VNPay có chữ ký</tspan></text><line class="msg" x1="500" y1="970" x2="1640" y2="970"/><text x="1070" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1070" dy="0">9. Chuyển trình duyệt tới VNPay Sandbox</tspan></text><line class="msg" x1="130" y1="1020" x2="1640" y2="1020"/><text x="885" y="1010" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="885" dy="0">10. Thực hiện giao dịch thử nghiệm</tspan></text><line class="ret" x1="1640" y1="1070" x2="500" y2="1070"/><text x="1070" y="1060" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1070" dy="0">11. Return URL (không quyết định kết quả)</tspan></text><line class="msg" x1="500" y1="1120" x2="860" y2="1120"/><text x="680" y="1110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="680" dy="0">12. GET payment-status</tspan></text><line class="msg" x1="860" y1="1170" x2="1220" y2="1170"/><text x="1040" y="1160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1040" dy="0">13. Đọc Payment/Order</tspan></text><line class="ret" x1="1220" y1="1220" x2="860" y2="1220"/><text x="1040" y="1210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1040" dy="0">14. Trạng thái đã xác minh hoặc PENDING/UNKNOWN</tspan></text><line class="ret" x1="860" y1="1270" x2="500" y2="1270"/><text x="680" y="1260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="680" dy="0">15. Trả trạng thái</tspan></text><line class="ret" x1="500" y1="1320" x2="130" y2="1320"/><text x="315" y="1310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="315" dy="0">16. Hiển thị kết quả hoặc Đang xác minh</tspan></text><line class="msg" x1="1640" y1="1390" x2="860" y2="1390"/><text x="1250" y="1380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1250" dy="0">17. IPN bất đồng bộ</tspan></text><line class="msg" x1="860" y1="1440" x2="860" y2="1440"/><text x="860" y="1421.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="860" dy="0">18. Xác minh chữ ký, tham chiếu, số tiền và mã</tspan><tspan x="860" dy="16.52">kết quả</tspan></text><rect class="frame" x="55" y="1470" width="1585" height="490"/><rect class="box" x="55" y="1470" width="65" height="30"/><text x="87" y="1491" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="87" dy="0">alt</tspan></text><text x="140" y="1495" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="140" dy="0">[IPN không hợp lệ]</tspan></text><line class="ret" x1="860" y1="1545" x2="1640" y2="1545"/><text x="1250" y="1535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1250" dy="0">19a. Từ chối; không cập nhật Database</tspan></text><line x1="55" y1="1580" x2="1640" y2="1580" stroke="#334155" stroke-dasharray="8 5"/><text x="140" y="1605" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="140" dy="0">[Thành công hợp lệ]</tspan></text><line class="msg" x1="860" y1="1650" x2="1220" y2="1650"/><text x="1040" y="1640" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1040" dy="0">19b. Payment SUCCESS; Order PAID; COMMIT</tspan></text><line class="ret" x1="860" y1="1685" x2="1640" y2="1685"/><text x="1250" y="1675" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1250" dy="0">20b. RspCode xác nhận</tspan></text><line x1="55" y1="1720" x2="1640" y2="1720" stroke="#334155" stroke-dasharray="8 5"/><text x="140" y="1745" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="140" dy="0">[Thất bại/hết hạn hợp lệ]</tspan></text><line class="msg" x1="860" y1="1785" x2="1220" y2="1785"/><text x="1040" y="1766.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1040" dy="0">19c. FAILED/EXPIRED; hoàn tồn đúng một lần;</tspan><tspan x="1040" dy="16.52">COMMIT</tspan></text><line class="ret" x1="860" y1="1815" x2="1640" y2="1815"/><text x="1250" y="1805" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1250" dy="0">20c. RspCode xác nhận</tspan></text><line x1="55" y1="1850" x2="1640" y2="1850" stroke="#334155" stroke-dasharray="8 5"/><text x="140" y="1875" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="140" dy="0">[Chưa xác định hợp lệ]</tspan></text><line class="msg" x1="860" y1="1910" x2="1220" y2="1910"/><text x="1040" y="1891.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1040" dy="0">19d. UNKNOWN/PENDING; không hoàn tồn; chặn</tspan><tspan x="1040" dy="16.52">retry; COMMIT</tspan></text><line class="ret" x1="860" y1="1940" x2="1640" y2="1940"/><text x="1250" y="1930" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="1250" dy="0">20d. RspCode xác nhận</tspan></text><line class="msg" x1="500" y1="1990" x2="860" y2="1990"/><text x="680" y="1980" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="680" dy="0">21. Tải trạng thái mới nhất</tspan></text><line class="ret" x1="860" y1="2030" x2="500" y2="2030"/><text x="680" y="2020" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#111827"><tspan x="680" dy="0">22. Kết quả cuối cùng đã xác minh</tspan></text></svg>