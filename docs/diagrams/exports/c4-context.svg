<rect x="216.6" y="284.2" width="146.8" height="31.6" fill="#FFFFFF" stroke="none"/>
<text x="290.0" y="296.6" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">Xem menu, đặt đơn,</text>
<text x="290.0" y="310.4" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">xem trạng thái đơn [HTTPS]</text>
<rect x="616.3" y="257.2" width="127.4" height="31.6" fill="#FFFFFF" stroke="none"/>
<text x="680.0" y="269.6" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">Xem đơn, cập nhật</text>
<text x="680.0" y="283.4" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">trạng thái xử lý [HTTPS]</text>
<rect x="1001.3" y="284.2" width="127.4" height="31.6" fill="#FFFFFF" stroke="none"/>
<text x="1065.0" y="296.6" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">Xem đơn, cập nhật</text>
<text x="1065.0" y="310.4" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">trạng thái xử lý [HTTPS]</text>
<rect x="434.1" y="559.2" width="211.7" height="31.6" fill="#FFFFFF" stroke="none"/>
<text x="540.0" y="571.6" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">Tạo yêu cầu thanh toán (URL có chữ ký),</text>
<text x="540.0" y="585.4" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">tra cứu kết quả (QueryDR) [HTTPS]</text>
<rect x="781.8" y="559.2" width="96.4" height="31.6" fill="#FFFFFF" stroke="none"/>
<text x="830.0" y="571.6" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">Gửi IPN kết quả</text>
<text x="830.0" y="585.4" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">giao dịch [HTTPS]</text>
<rect x="78.8" y="537.3" width="182.5" height="45.4" fill="#FFFFFF" stroke="none"/>
<text x="170.0" y="549.7" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">Thanh toán trên trang thử nghiệm;</text>
<text x="170.0" y="563.5" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">VNPay chuyển khách về BrewLite</text>
<text x="170.0" y="577.3" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#000000">(Return URL) [HTTPS]</text>
