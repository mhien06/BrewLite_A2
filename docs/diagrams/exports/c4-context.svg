<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
<title>BrewLite – C4 Level 1: System Context</title>
<rect x="0" y="0" width="1400" height="840" fill="#FFFFFF"/>
<text x="30.0" y="40.0" text-anchor="start" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000">BrewLite – C4 Level 1: System Context</text>
<rect x="130" y="80" width="330" height="126" rx="14" ry="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="295.0" y="105.8" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000000">Khách hàng</text>
<text x="295.0" y="122.4" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">[Person]</text>
<text x="295.0" y="155.5" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">Xem menu, chọn size/topping, đặt đơn,</text>
<text x="295.0" y="172.0" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">thanh toán và theo dõi đơn,</text>
<text x="295.0" y="188.6" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">nhận đồ uống tại quầy</text>
<rect x="530" y="80" width="310" height="126" rx="14" ry="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="685.0" y="114.1" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000000">Nhân viên quầy</text>
<text x="685.0" y="130.6" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">[Person]</text>
<text x="685.0" y="163.8" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">Xem đơn của cửa hàng,</text>
<text x="685.0" y="180.3" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">cập nhật tiến độ chuẩn bị/bàn giao</text>
<rect x="910" y="80" width="310" height="126" rx="14" ry="14" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="1065.0" y="114.1" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000000">Quản lý cửa hàng</text>
<text x="1065.0" y="130.6" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">[Person]</text>
<text x="1065.0" y="163.8" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">Theo dõi và xử lý đơn</text>
<text x="1065.0" y="180.3" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">theo quyền hạn</text>
<rect x="420" y="340" width="520" height="150" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
<text x="680.0" y="377.8" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000000">BrewLite</text>
<text x="680.0" y="394.4" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">[Software System]</text>
<text x="680.0" y="427.5" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">Ứng dụng đặt đồ uống trực tuyến cho một cửa hàng:</text>
<text x="680.0" y="444.0" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">menu, giỏ hàng, đặt đơn, tồn kho theo Product,</text>
<text x="680.0" y="460.6" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">thanh toán thử nghiệm và xử lý đơn tại quầy</text>
<rect x="420" y="660" width="520" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="680.0" y="696.1" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000000">VNPay Sandbox</text>
<text x="680.0" y="712.6" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">[External System]</text>
<text x="680.0" y="745.8" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">Payment Service mô phỏng: trang thanh toán thử nghiệm,</text>
<text x="680.0" y="762.3" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#000000">Return URL, IPN, QueryDR. Không có giao dịch tiền thật</text>
<rect x="990" y="660" width="380" height="112" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="1000.0" y="680.9" text-anchor="start" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#000000">Chú thích</text>
<text x="1000.0" y="695.4" text-anchor="start" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">[Person]: người dùng hệ thống</text>
<text x="1000.0" y="709.9" text-anchor="start" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">[Software System]: hệ thống đang xây dựng</text>
<text x="1000.0" y="724.4" text-anchor="start" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">[External System]: hệ thống bên ngoài BrewLite</text>
<text x="1000.0" y="738.9" text-anchor="start" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">Mũi tên nét liền: tương tác, nhãn ghi mục đích [giao thức]</text>
<text x="1000.0" y="753.4" text-anchor="start" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000">Mũi tên nét đứt hai chiều: thao tác qua trình duyệt</text>
