# A2 local development. All host ports are different from BrewLite A1.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brewlite_a2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brewlite_a2"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - brewlite_a2_pg:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @brewlite/api dev
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/brewlite_a2
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      API_PORT: 3003
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_QUERY_URL: ${VNPAY_QUERY_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3002/payment/return}
      VNPAY_QUERY_IP: ${VNPAY_QUERY_IP:-127.0.0.1}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-}
      PAYMENT_RECONCILIATION_ENABLED: ${PAYMENT_RECONCILIATION_ENABLED:-true}
      FRONTEND_URL: http://localhost:${WEB_PORT:-3002}
    ports:
      - "${API_PORT:-3003}:3003"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @brewlite/web dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3003}
      API_INTERNAL_URL: http://api:3003
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3002}:3002"
    depends_on:
      - api
volumes:
  brewlite_a2_pg:
